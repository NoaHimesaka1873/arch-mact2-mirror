# Mirror each repo from rsync://mirror.funami.tech every 3 hours and upload it to its own GitHub release in NoaHimesaka1873/arch-mact2-mirror
name: Mirror

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  Download-and-upload:
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: arch-mact2
            release: release
          - repo: kait2en
            release: kait2en
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/repo
          key: ${{ matrix.repo }}
          fail-on-cache-miss: false
      
      - name: Delete Cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh extension install actions/gh-actions-cache
          gh actions-cache delete ${{ matrix.repo }} -R NoaHimesaka1873/arch-mact2-mirror -B senpai --confirm || true

      - name: Download
        run: |
          rsync -avz --delete rsync://mirror.funami.tech/${{ matrix.repo }}/ ${{ github.workspace }}/repo

      - name: Save Cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/repo 
          key: ${{ matrix.repo }}

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ${{ github.workspace }}/repo/os/x86_64
          gh release upload ${{ matrix.release }} ./* --clobber -R NoaHimesaka1873/arch-mact2-mirror
